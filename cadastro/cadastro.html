<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - One Piece Store</title>
    <link rel="stylesheet" href="cadastro.css">
</head>

<body>
    <header>
        <h1>One Piece Store</h1>
        <nav>

            <a href="../index.html">Home</a>
            <a href="../login/login.html">Login</a>

        </nav>
    </header>

    <main>
        <h2>Junte-se á Tripulação</h2>
        <form action="login.html">

            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo">



            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Seuemail@exemplo.com">



            <label for="nascimento">Data de Nascimento:</label>
            <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>



            <label for="senha">Senha:</label>
            <input type="email" id="email" name="email" placeholder="Sua senha" maxlength="10">



            <label for="confirmar-senha">Confirmar Senha:</label maxlength="10">
            <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Redigite a senha" required>



            <label for="rg">RG:</label>
            <input type="text" id="rg" name="rg" placeholder="00.000.000-00" required>



            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>



            <label for="endereço">Endereço:</label>
            <input type="text" id="endereço" name="endereço" placeholder="Rua, Número, Bairro" required>



            <label for="cep">CEP:</label>
            <input type="text" id="cep" name="cep" placeholder="00000-000" required>



            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" name="cidade" placeholder="Sua cidade" required>



            <label for="estado">Estado:</label>
            <input type="text" id="estado" name="estado" placeholder="EX: SP" required>



            <label for="pais">País:</label>
            <input type="text" id="pais" name="pais" placeholder="EX: Brasil" required>


            <button type="submit" class="button">Finalizar Cadastro!</button>
        </form>

        <a href="../login/login.html">Já tem uma conta? Voltar para o Login</a>


    </main>
    <footer>
        2026 One Piece Store - Todos os direitos reservados.
    </footer>
</body>

</html>
