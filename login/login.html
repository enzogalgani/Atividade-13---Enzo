<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - One Piece Store</title>
    <link rel="stylesheet" href="../login/login.css">
</head>

<body>
    <header>
        <h1>One Piece</h1>
        <nav>
            <a href="../index.html">Voltar para Home</a>

        </nav>
    </header>

    <main>
        <img src="../assets.img/Bandeira.png" alt="Imagem de Login One Piece" height="200px">
        <h2>Acessar sua Conta:</h2>

        <form action="../index.html">
            <p>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="Seu e-mail">
            </p>
            <p>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Sua senha">
            </p>
            <p>
                <input type="submit" value="Entrar">
            </p>
        </form>
        <p>
            <a href="../esqueciasenha/esqueci.a.senha.html">Esqueci minha senha</a>
        </p>
        <p>
            <a href="../cadastro/cadastro.html">Não tem cadastro? Cadastre-se</a>
        </p>

        <footer>
            <p>Todos os direitos reservados - One Piece Store</p>
        </footer>

    </main>




</body>

</html>
